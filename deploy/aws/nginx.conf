# AMS S3 demo — single public entry point in front of the four app processes.
#   /                          -> FastAPI console on :8000 (API under /api, React SPA elsewhere)
#   /apps/policycore/          -> Streamlit MapleSure portal on :8501 (CR-2026-041/042 target)
#   /apps/claimsportal/policy/ -> ClaimsPortal policy-service on :8081 (CR-2026-043 target)
#   /apps/claimsportal/claims/ -> ClaimsPortal claims-service on :8082 (CR-2026-043 target)
#
# Installed to /etc/nginx/sites-available/ams-s3-demo by bootstrap.sh.

server {
    listen 80 default_server;
    server_name _;

    # The S3 pipeline's analyze/codegen beats stream for a long time and the
    # agent harness can run for minutes. nginx's 60s default would cut the
    # money-shot beat off mid-stream.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Streamlit is websocket-driven; without the Upgrade headers PolicyCore
    # renders once and then goes permanently "connecting".
    location /apps/policycore/ {
        proxy_pass http://127.0.0.1:8501/apps/policycore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # policy-service/claims-service are plain FastAPI + a static HTML console —
    # no websocket needed. The trailing "/" on both location and proxy_pass
    # strips the location prefix so the backend (routed at its own root: /,
    # /api/*, /health) never sees /apps/claimsportal/... — the static
    # consoles' JS fetches relative paths ("api/policies", not "/api/policies")
    # for exactly this reason, so they resolve correctly under either prefix.
    location /apps/claimsportal/policy/ {
        proxy_pass http://127.0.0.1:8081/;
    }

    location /apps/claimsportal/claims/ {
        proxy_pass http://127.0.0.1:8082/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Server-sent events from the S3 pipeline: buffering here would batch the
        # token stream and destroy the live-typing effect the demo depends on.
        proxy_buffering off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
