# AMS S3 demo — single public entry point in front of the two app processes.
#   /          -> FastAPI console on :8000 (API under /api, React SPA elsewhere)
#   /sl_policycore/    -> Streamlit MapleSure portal on :8501
#
# Installed to /etc/nginx/sites-available/ams-s3-demo by bootstrap.sh.

server {
    listen 80 default_server;
    server_name _;

    # The S3 pipeline's analyze/codegen beats stream for a long time and the
    # agent harness can run for minutes. nginx's 60s default would cut the
    # money-shot beat off mid-stream.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # This path must match STREAMLIT_BASE_URL_PATH in .env (default
    # sl_policycore) — that is what Streamlit is told to serve under, and what
    # MOCKAPP_URL / the frontend's VITE_MOCKAPP_URL link to. Change one and you
    # change all four, or the portal 404s only when it is behind this proxy.
    #
    # Streamlit is websocket-driven; without the Upgrade headers the mockapp
    # renders once and then goes permanently "connecting".
    location /sl_policycore/ {
        proxy_pass http://127.0.0.1:8501/sl_policycore/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Server-sent events from the S3 pipeline: buffering here would batch the
        # token stream and destroy the live-typing effect the demo depends on.
        proxy_buffering off;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
