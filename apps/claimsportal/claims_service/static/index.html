<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapleSure — Benefit Claims</title>
<style>
  :root {
    --accent: #b45309;
    --accent-soft: #fffbeb;
    --ink: #1e293b;
    --muted: #64748b;
    --line: #e2e8f0;
    --bg: #f8fafc;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #7c2d12, #b45309);
    color: #fff; padding: 1.1rem 2rem;
    display: flex; align-items: baseline; gap: .75rem;
  }
  header h1 { font-size: 1.25rem; font-weight: 700; }
  header .team {
    font-size: .8rem; background: rgba(255,255,255,.18);
    padding: .2rem .6rem; border-radius: 999px; letter-spacing: .03em;
  }
  main {
    max-width: 1000px; margin: 2rem auto; padding: 0 1.5rem;
    display: grid; grid-template-columns: 340px 1fr; gap: 1.5rem; align-items: start;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(15,23,42,.06); overflow: hidden;
  }
  .card h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); background: var(--accent-soft);
    padding: .7rem 1.1rem; border-bottom: 1px solid var(--line);
  }
  form { padding: 1.1rem; display: grid; gap: .8rem; }
  label { font-size: .8rem; font-weight: 600; color: var(--muted); display: grid; gap: .3rem; }
  select, input, textarea {
    padding: .55rem .8rem; border: 1px solid var(--line); border-radius: 8px;
    font-size: .95rem; font-family: inherit; width: 100%; background: #fff;
  }
  select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  button[type=submit] {
    padding: .65rem; border: none; border-radius: 8px; background: var(--accent);
    color: #fff; font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  button[type=submit]:hover { filter: brightness(1.1); }
  #result { padding: 0 1.1rem 1.1rem; font-size: .9rem; display: none; }
  #result.ok { display: block; color: #15803d; }
  #result.bad { display: block; color: #b91c1c; }
  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  th, td { text-align: left; padding: .7rem 1rem; }
  th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
  tr + tr td { border-top: 1px solid var(--line); }
  td.num { font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; padding: .15rem .6rem; border-radius: 999px;
    font-size: .72rem; font-weight: 600; white-space: nowrap;
  }
  .badge.accepted { background: #dcfce7; color: #15803d; }
  .badge.rejected { background: #fee2e2; color: #b91c1c; }
  .empty { padding: 2rem; text-align: center; color: var(--muted); }
  .refresh-row { display: flex; justify-content: flex-end; padding: .6rem 1rem; border-top: 1px solid var(--line); }
  .refresh-row button {
    border: 1px solid var(--line); background: #fff; border-radius: 8px;
    padding: .4rem .9rem; font-size: .85rem; cursor: pointer; color: var(--ink);
  }
  footer { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
<header>
  <h1>MapleSure Insurance</h1>
  <span class="team">CLAIMS TEAM</span>
</header>
<main>
  <div class="card">
    <h2>Submit a claim</h2>
    <form id="claimForm">
      <label>Group contract
        <select id="policyNumber" required>
          <option value="">Loading contracts…</option>
        </select>
      </label>
      <label>Amount (CAD)
        <input id="amount" type="number" min="1" step="1" required placeholder="e.g. 1200">
      </label>
      <label>Description
        <textarea id="description" rows="3" required placeholder="Service received, provider, and date"></textarea>
      </label>
      <button type="submit">Submit claim</button>
    </form>
    <div id="result"></div>
  </div>

  <div class="card">
    <h2>Submitted claims</h2>
    <table>
      <thead>
        <tr><th>#</th><th>Contract</th><th>Plan sponsor</th><th>Amount</th><th>Status</th></tr>
      </thead>
      <tbody id="claimRows"><tr><td colspan="5" class="empty">No claims yet</td></tr></tbody>
    </table>
    <div class="refresh-row"><button id="refresh" type="button">Refresh</button></div>
  </div>
  <footer>claims-service · port 8082 · validates against policy-service on :8081 · synthetic demo data</footer>
</main>
<script>
  const fmt = new Intl.NumberFormat("en-CA", { style: "currency", currency: "CAD", maximumFractionDigits: 0 });

  async function loadPolicies() {
    const select = document.getElementById("policyNumber");
    try {
      const policies = await (await fetch("api/claims/policy-directory")).json();
      select.innerHTML = '<option value="">Select a contract…</option>' + policies.map(p =>
        `<option value="${p.policyNumber}">${p.policyNumber} — ${p.holderName} (${p.product}, ${p.status})</option>`
      ).join("");
    } catch {
      select.innerHTML = '<option value="">policy-service unreachable — type below</option>';
    }
  }

  async function loadClaims() {
    const rows = document.getElementById("claimRows");
    let claims;
    try {
      claims = await (await fetch("api/claims")).json();
    } catch {
      rows.innerHTML = '<tr><td colspan="5" class="empty">Could not reach claims-service API</td></tr>';
      return;
    }
    if (!claims.length) {
      rows.innerHTML = '<tr><td colspan="5" class="empty">No claims yet</td></tr>';
      return;
    }
    rows.innerHTML = claims.slice().reverse().map(c => `
      <tr>
        <td>${c.id}</td>
        <td><strong>${c.policyNumber}</strong></td>
        <td>${c.holderName}</td>
        <td class="num">${fmt.format(c.amount)}</td>
        <td><span class="badge ${c.status === "ACCEPTED" ? "accepted" : "rejected"}">${c.status}</span></td>
      </tr>`).join("");
  }

  document.getElementById("claimForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const result = document.getElementById("result");
    result.className = "";
    const body = {
      policyNumber: document.getElementById("policyNumber").value,
      amount: Number(document.getElementById("amount").value),
      description: document.getElementById("description").value
    };
    try {
      const res = await fetch("api/claims", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (res.ok) {
        result.className = data.status === "ACCEPTED" ? "ok" : "bad";
        result.textContent = `Claim #${data.id} → ${data.status}`;
        e.target.reset();
      } else {
        result.className = "bad";
        result.textContent = data.error || `Request failed (${res.status})`;
      }
    } catch {
      result.className = "bad";
      result.textContent = "Could not reach claims-service API";
    }
    loadClaims();
  });

  document.getElementById("refresh").addEventListener("click", loadClaims);
  loadPolicies();
  loadClaims();
</script>
</body>
</html>
